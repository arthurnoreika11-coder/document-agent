<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header with theme toggle -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Document Agent</h1>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span class="toggle-track"></span>
                    <span class="toggle-thumb"></span>
                </button>
            </div>
        </header>

        <main class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-container">
                    <h2 class="section-title">Upload Document</h2>
                    
                    <div class="upload-area" id="uploadArea">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <h3 class="upload-title">Drag and drop your file here</h3>
                        <p class="upload-subtitle">or click to select</p>
                        <input type="file" id="fileInput" class="file-input" accept=".pdf,.doc,.docx,.txt,.md" />
                    </div>

                    <div class="file-info" id="fileInfo" style="display: none;">
                        <p class="selected-file">Selected: <span id="fileName"></span></p>
                        <button class="btn btn-primary" id="uploadBtn">Analyze Document</button>
                    </div>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-section">
                <h2 class="section-title">Analysis Results</h2>
                <div class="results-container">
                    <div class="results-panel" id="resultsPanel">
                        <div class="results-placeholder">
                            <p>Upload and analyze a document to see results here</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        // Check for saved theme preference or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        updateToggleState();

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleState();
        });

        function updateToggleState() {
            const theme = html.getAttribute('data-theme');
            themeToggle.classList.toggle('active', theme === 'dark');
        }

        // File upload handling
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const resultsPanel = document.getElementById('resultsPanel');

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            fileName.textContent = file.name;
            fileInfo.style.display = 'block';
        }

        // Upload and stream results
        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Analyzing...';
            resultsPanel.innerHTML = '<div class="streaming-content"></div>';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Analysis failed');
                }

                const reader = response.body.getReader();
                const streamingContent = resultsPanel.querySelector('.streaming-content');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const text = new TextDecoder().decode(value);
                    streamingContent.innerHTML += escapeHtml(text).replace(/\n/g, '<br>');
                    streamingContent.scrollTop = streamingContent.scrollHeight;
                }

                streamingContent.classList.add('complete');
            } catch (error) {
                resultsPanel.innerHTML = `<div class="error-message">Error: ${error.message}</div>`;
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Analyze Document';
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
